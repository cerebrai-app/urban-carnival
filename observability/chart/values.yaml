otelCollector:
  image: otel/opentelemetry-collector-contrib:0.114.0

zipkin:
  image: openzipkin/zipkin:3

cassandra:
  image: openzipkin/zipkin-cassandra:latest
  storage: 5Gi

zipkinDependencies:
  image: openzipkin/zipkin-dependencies:3
  # Hourly - computes the service dependency graph from spans already
  # stored in Cassandra.
  schedule: "0 * * * *"

prometheus:
  image: prom/prometheus:v3.0.1
  storage: 10Gi

grafana:
  image: grafana/grafana:11.4.0
  storage: 1Gi

loki:
  image: grafana/loki:3.3.0
  storage: 10Gi
