apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zipkin
spec:
  ingressClassName: traefik
  rules:
    - host: zipkin
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zipkin
                port:
                  number: 9411
