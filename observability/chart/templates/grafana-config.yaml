apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.{{ .Release.Namespace }}.svc.cluster.local:9090
        isDefault: true

      - name: Zipkin
        type: zipkin
        access: proxy
        url: http://zipkin.{{ .Release.Namespace }}.svc.cluster.local:9411
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: cerebrai
        orgId: 1
        folder: cerebrai
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  cerebrai-overview.json: |
    {
      "title": "cerebrai overview",
      "uid": "cerebrai-overview",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Scrape targets up",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "datasource": "Prometheus",
          "targets": [
            { "expr": "up", "refId": "A" }
          ]
        }
      ]
    }
