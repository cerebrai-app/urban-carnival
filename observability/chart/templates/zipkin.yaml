apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  labels:
    app: zipkin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      initContainers:
        - name: wait-for-cassandra
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z cassandra 9042; do echo waiting for cassandra; sleep 2; done
      containers:
        - name: zipkin
          image: {{ .Values.zipkin.image }}
          env:
            - name: STORAGE_TYPE
              value: cassandra3
            - name: CASSANDRA_CONTACT_POINTS
              value: cassandra
          ports:
            - name: http
              containerPort: 9411
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
spec:
  selector:
    app: zipkin
  ports:
    - name: http
      port: 9411
      targetPort: 9411
