# GoReleaser configuration for the CLI (cmd/cerebrai) and the GitHub
# release itself. Used by the "Release" workflow (release.yml).
#
# The CLI is pure Go, so `goreleaser release` cross-compiles every target
# on one runner and creates the GitHub release. The Fyne desktop app needs
# cgo and a native toolchain per OS, so it is built separately on matrix
# runners (see .goreleaser.desktop.yaml) and its binaries are uploaded onto
# the release this config creates.
#
# Validate with `goreleaser check`. Try a build without publishing:
#   goreleaser release --snapshot --clean
version: 2

project_name: cerebrai

before:
  hooks:
    - go mod download

builds:
  - id: cerebrai
    main: ./cmd/cerebrai
    binary: cerebrai
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/cerebrai-app/urban-carnival/internal/config.Version={{ .Version }}
      - -X github.com/cerebrai-app/urban-carnival/internal/config.Commit={{ .ShortCommit }}
      - -X github.com/cerebrai-app/urban-carnival/internal/config.Date={{ .CommitDate }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: cli
    ids: [cerebrai]
    name_template: >-
      {{ .ProjectName }}-cli_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - DESIGN.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: cerebrai-app
    name: urban-carnival
  draft: false
  prerelease: auto
  mode: append
  name_template: "{{ .Version }}"
